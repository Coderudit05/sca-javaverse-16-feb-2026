<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body{
        background-color: black;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      input{
        padding: 10px 20px;
        border-radius: 10px;
        border: none;
      }

      input:focus{
        outline: none;
      }
    </style>
  </head>
  <body>
    <input type="text" placeholder="Enter Your Name" />
  </body>
</html>
