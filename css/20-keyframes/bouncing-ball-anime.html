<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
      }
      body {
        background-color: black;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .box {
        height: 300px;
        width: 350px;
        background-color: white;
        border-radius: 10px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;

        padding: 15px 0px;
        
      }

      .ball {
        height: 80px;
        width: 80px;
        background: linear-gradient(
          to right,
          rgb(236, 72, 153),
          rgb(239, 68, 68),
          rgb(234, 179, 8)
        );
        border-radius: 50%;
        margin-bottom: 2px;

        animation: ball-anime 0.8s ease-in-out infinite;
      }

      @keyframes ball-anime {
        0%,
        100% {
          transform: translate(0);
        }
        50% {
          transform: translate(0, -200px);
        }

        /* 100%{
            
            transform: translate(0);
        } */
      }

      .shadow {
        height: 20px;
        width: 80px;
        background-color: gray;
        border-radius: 50%;

        animation: shadow-anime 0.8s ease-in-out infinite;
      }

      @keyframes shadow-anime {

        0%,100%{
            transform: scale(1);
        }
        50%{
            transform: scale(0.5);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="ball"></div>
      <div class="shadow"></div>
    </div>
  </body>
</html>
