<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        background-color: black;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .box {
        height: 250px;
        width: 600px;
        background-color: white;

        border-radius: 10px;

        display: flex;

        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .status {
        /* background-color: purple; */

        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 5px 10px;
        font-size: 24px;

        font: bolder;

        width: 80%;
      }

      .status span:nth-child(1) {
        color: red;
      }

      .status span:nth-child(2) {
        color: green;
      }

      .progress-bard-box {
        height: 30px;
        width: 80%;
        background-color: gainsboro;
        border-radius: 50px;

        position: relative;
        overflow: hidden;
      }

      .progress-bard-box::before {
        content: "";
        height: 100%;
        width: 0%;
        background-color: greenyellow;
        position: absolute;
        border-radius: 50px;

        animation-name: progress-bar-anime;
        animation-duration: 5s;
        /* animation-timing-function: linear; */
      }

      @keyframes progress-bar-anime {
        /* from{
                
                width: 0;
            }
            to{
                width: 100%;
            } */

        0% {
          width: 0;
          background-color: rgba(255, 0, 0, 0.652);
        }
        
        30% {
            width: 30%;
            background-color: red;
        }
        35% {
            background-color: rgb(0, 255, 183);
            width: 35%;
        }
        60% {
            background-color: rgb(0, 255, 183);
            width: 60%;
        }
        
        65% {
            background-color: rgb(0, 255, 183);
            width: 65%;
        }
        
        70% {
            background-color: rgb(0, 255, 183);
            width: 70%;
        }
        
        80% {
            background-color: rgb(0, 255, 183);
            width: 80%;
        }
        
        85% {
            width: 85%;
            background-color: rgb(0, 255, 64);
        }
        
        93% {
            width: 93%;
            background-color: rgb(94, 255, 0);
        }
        
        97% {
            width: 97%;
            background-color: rgb(200, 255, 0);
        }
        
        100% {
            width: 100%;
            background-color: rgb(255, 179, 0);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="status">
        <span>0%</span>
        <span>100%</span>
      </div>

      <div class="progress-bard-box"></div>
    </div>
  </body>
</html>
