<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      /* 

      Note : here we are doing applying the common property on the different element but we can reduce this type of styling usign the group selector so with the help of this group selector we can call all the elements in a single line 
        h1{
            background-color: wheat;
        }

        div{
            background-color: wheat;
        }

        h3{
            background-color: wheat;
        }
             */


        h1,div,h3,p,span{
            background-color: wheat;
        }
    </style>
  </head>
  <body>
    <h1>Hello this is h1</h1>
    <div>hello this is box</div>
    <h3>hello this is h3</h3>
    <p>hello this is para</p>
    <span>hello everyone this is span</span>
  </body>
</html>
