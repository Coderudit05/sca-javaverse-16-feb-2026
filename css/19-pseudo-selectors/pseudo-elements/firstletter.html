<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background-color: black;
        color: white;

        padding: 40px;

        
      }

      p{
        font-size: 30px;
        width: 400px;
      }

      p::first-letter{
        font-size: 50px;
        color: red;
      }
    </style>
  </head>
  <body>
    <p>
      Hello this is the basic tutorial of pseudo elements in this part we are
      learing about the first line
    </p>
  </body>
</html>
