    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
            input[type='email']{
                border: none;
                outline: none;
            }

            input[type='password']{
                color: crimson;
            }
        </style>
    </head>
    <body>

        <form action="">
            <label for="name">Name :</label>
            <input id="name" type="text" placeholder="Your Name">
            
            <br>
            <br>
            <label for="mail">Email :</label>
            <input id="mail" type="email" placeholder="Your Email">
            
            <br>
            <br>
            <label for="pass">Password :</label>
            <input id="pass" type="password" placeholder="Your password">
            
            <br>
            <br>
            <label for="number">Mo. Number :</label>
            <input id="number" type="number" placeholder="Enter Your Mobile Number">
        </form>
        
    </body>
    </html>
