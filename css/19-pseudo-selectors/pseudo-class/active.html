<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        background: linear-gradient(
          to bottom right,
          rgb(55, 65, 81),
          rgb(17, 24, 39),
          rgb(0, 0, 0)
        );


        display: flex;
        align-items: center;
        justify-content: center;
      }

      button{
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;

        border: none;
        background-color: brown;
        color: white;
        
        transition: all 0.3s ease-in-out;
      }

      button:active{
        background-color: aquamarine;
      }


    </style>
  </head>
  <body>
    <button>Hover Me</button>
  </body>
</html>
