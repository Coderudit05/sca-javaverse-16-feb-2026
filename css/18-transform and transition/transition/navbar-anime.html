<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      header {
        display: flex;
        /* background-color: brown; */
        height: 64px;

        align-items: center;
        justify-content: space-between;

        padding: 0 40px;

        box-shadow: 0px 0px 10px gray;
        /* border-bottom: 1px solid #000; */
      }

      nav {
        display: flex;
        gap: 20px;
      }

      nav a {
        text-decoration: none;
        /* text-decoration: underline; */

        /* border-bottom: 2px solid red; */

        font-size: 20px;

        /* background-color: red; */

        position: relative;
      }

      nav a::before {
        content: "";
        height: 2px;
        width: 0%;
        background-color: red;

        position: absolute;

        bottom: 0;

        transition-property: width;
        transition-duration: 2s;
        /* transition-timing-function: linear; */
        transition-timing-function: ease-in-out;



      }

      nav a:hover::before {
        width: 100%;

      }

      #nav-btn {
      }

      #nav-btn button {
        padding: 10px 20px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="logo">
        <h2>Portfolio.</h2>
      </div>

      <nav class="">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Work</a>
        <a href="#">Experience</a>
      </nav>

      <div id="nav-btn">
        <button class="">Get Started</button>
      </div>
    </header>
  </body>
</html>
