<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        background: linear-gradient(
          to right,
          rgb(249, 168, 212),
          rgb(216, 180, 254),
          rgb(129, 140, 248)
        );

        display: flex;
        align-items: center;
        justify-content: center;
      }

      .box {
        height: 250px;
        width: 400px;
        background: linear-gradient(
          to right,
          rgb(165, 180, 252),
          rgb(192, 132, 252)
        );
        border-radius: 10px;
      }

      .dots {
        /* background-color: purple; */

        height: 80%;

        display: flex;
        align-items: end;
        justify-content: center;
        gap: 20px;
      }

      .dot {
        height: 30px;
        width: 30px;
        /* border: 2px solid white; */
        border-radius: 50%;

        /* background-color: brown; */

        animation: dots-anime 1s linear infinite;
      }

      .dot:nth-child(1) {
        background-color: aqua;
        animation-delay: 0.1s;
      }
      .dot:nth-child(2) {
        background-color: brown;
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        background-color: blueviolet;
        animation-delay: 0.3s;
      }
      .dot:nth-child(4) {
        background-color: plum;
        animation-delay: 0.4s;
      }
      .dot:nth-child(5) {
        background-color: peru;
        animation-delay: 0.5s;
      }
      .dot:nth-child(6) {
        background-color: palevioletred;
        animation-delay: 0.6s;
      }

      @keyframes dots-anime {
        0%,
        100% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-100px);
        }
      }

      .box p {
        font-size: 20px;
        font-weight: bolder;
        color: white;
        text-align: center;
        margin-top: 10px;

        animation: text-anime 1.5s linear infinite;
      }

      @keyframes text-anime {
        0%,
        100% {
          color: white;
        }

        50% {
          color: rgba(255, 255, 255, 0.517);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span>
        <span class="dot"></span>
      </div>
      <p>Loading Your Content</p>
    </div>
  </body>
</html>
