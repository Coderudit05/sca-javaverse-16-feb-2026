<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background-color: black;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      button {
        padding: 10px 20px;

        border-radius: 6px;
        cursor: pointer;
        background-color: brown;
        color: white;
        font-size: 16px;
        border: none;
        position: relative;
        overflow: hidden;

        z-index: 1;
      }

      button::before {
        content: "";
        height: 100%;
        width: 0%;
        background-color: blueviolet;
        position: absolute;

        top: 0;
        left: 0;

        z-index: -1;

        transition-duration: width;
        transition-duration: 0.3s;
      }

      button:hover::before {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <button>Hover Me</button>
  </body>
</html>
