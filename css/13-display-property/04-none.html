<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      span {
        background-color: yellow;
        border: 1px solid black;

        height: 300px;
        width: 300px;

        /* display: none; */
        visibility: hidden;
      }

      i {
        background-color: purple;
        color: white;
      }

      a {
        text-decoration: none;
        background-color: rgb(190, 154, 224);
        color: white;
      }
    </style>
  </head>
  <body>
    <span>Hello this is a inline element</span>
    <span>Hello this is another inline element</span>
    <span>Hello this is another inline element</span>
    <span>Hello this is another inline element</span>
    <span>Hello this is another inline element</span>
    <i>Hello this is i tag</i>
    <a href="">Hello this is anchor tag</a>
  </body>
</html>
