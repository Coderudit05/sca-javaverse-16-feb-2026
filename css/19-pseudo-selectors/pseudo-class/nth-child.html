<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }
      .btns-wrapper{
        background-color: black;
        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
      }

      button{
        padding: 10px 20px;
        background-color: brown;
        color: white;
        font-size: 16px;
        border-radius: 10px;
        border: none;
      }

      /* button:nth-child(3){
        background-color: purple;
      } */

    button:nth-child(3n){
        background-color: purple;
    }


    </style>
  </head>
  <body>
    <div class="btns-wrapper">
      <button id="btn1">Button1</button>
      <button id="btn2">Button2</button>
      <button id="btn3">Button3</button>
      <button id="btn4">Button4</button>
      <button id="btn4">Button5</button>
      <button id="btn4">Button6</button>

    </div>
  </body>
</html>
