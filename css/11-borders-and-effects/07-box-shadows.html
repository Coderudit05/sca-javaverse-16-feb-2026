
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box{
            background-color: whitesmoke;
            height: 400px;
            width: 400px;
            margin: 20px 40px;
            cursor: pointer;

            transition: all 0.3s linear;
            
        }

        .box:hover{
            box-shadow: 0px 0px 20px black;

        }


    </style>
</head>
<body>

    <div class="box">
        hello this is the example of the box shadow
    </div>
    
</body>
</html>
