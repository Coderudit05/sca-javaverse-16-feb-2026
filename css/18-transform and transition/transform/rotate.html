<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body{
        background-color: gray;
      }

      .box{
        height: 100px;
        width: 100px;
        background-color: brown;
      }


    .box:nth-child(1){
        background-color: purple;

    }
    .box:nth-child(2){
        background-color: brown;
    }
    .box:nth-child(3){
        background-color: green;
        /* margin-top: 100px; */


        /* transform: translateY(200px); */
        /* transform: translateX(500px); */

        transform: translate(200px,300px) rotate(45deg) scale(0.5) skew(45deg);
        
    }
    .box:nth-child(4){
        background-color: yellow;
    }


    </style>
  </head>
  <body>

    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </body>
</html>
